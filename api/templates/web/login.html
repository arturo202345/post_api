{% extends "web/base.html" %}
{% block titulo %}Iniciar sesión · Gestión Académica{% endblock %}
{% block cuerpo %}
<div class="auth">
  <div class="centro">
    <div class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82zM12 3L1 9l11 6 9-4.91V17h2V9L12 3z"/></svg></div>
    <h1 style="margin:0">Gestión Académica</h1>
    <p class="suave">Inicia sesión para ver tu progreso</p>
  </div>
  <form method="post" novalidate>
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <label for="username">Usuario</label>
    <input id="username" name="username" value="{{ usuario }}" autocomplete="username" autocapitalize="none" required autofocus>
    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    {% if error %}<p class="error caja">{{ error }}</p>{% endif %}
    <button class="boton" type="submit">Iniciar sesión</button>
  </form>
  <p class="enlace"><a href="{% url 'web:registro' %}">¿No tienes cuenta? Crear cuenta</a></p>
</div>
{% endblock %}
